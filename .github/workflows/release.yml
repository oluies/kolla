name: release

# A tag is the trigger, so the version published is the version tagged and
# nothing else decides it. A Central release is immutable, so a tag stages the
# bundle and the Portal's Publish button is the irreversible step; `release:
# true` is there for when that is wanted in one go.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload a bundle to the Portal and stage it'
        type: boolean
        default: false
      release:
        description: 'Release it rather than leaving it staged'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache coursier and mill
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill') }}
          restore-keys: mill-${{ runner.os }}-

      # The tag has to agree with the version in the build, or the artifact
      # would not be the one the tag names.
      - name: Check the tag against publishVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built=$(./mill show kernel.jvm.publishVersion | tr -d '"')
          tagged=${GITHUB_REF_NAME#v}
          echo "built=$built tagged=$tagged"
          test "$built" = "$tagged"

      - run: ./mill __.jvm.compile
      - run: ./mill kernel.jvm.test + export.jvm.test + dsl.jvm.test

      # Builds and signs exactly what would be uploaded, and uploads nothing.
      # This is the whole of a dispatch run unless `upload` was asked for.
      - name: Build the artifacts
        run: ./mill __.jvm.publishArtifacts

      # Signing and upload. Mill reads all four from the environment and none
      # is echoed. A tag stages; releasing is a choice.
      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: |
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll \
            --publishArtifacts __.jvm.publishArtifacts \
            --shouldRelease ${{ inputs.release == true }}

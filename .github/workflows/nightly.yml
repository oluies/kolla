name: nightly

# The standard library and a mathlib sample are hours of work and gigabytes of
# export. They are run on request rather than on a schedule: a nightly run of
# this size costs hours of runner time whether or not anything changed, and the
# last scheduled one lost two jobs to a cancellation that had nothing to do
# with kolla. The name is kept so the history stays in one place.
on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: The toolchain to run, or empty for every one in the matrix
        required: false
        default: ''

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - v4.28.0
          - v4.35.0
        corpus:
          - init
          - std
          - lean
        # Every combination runs. `std` and `lean` on a pre-v4.35 profile need
        # `--defeq-cache` to finish at all (docs/semantics.md P12), which the
        # step below passes for those toolchains. It changes no verdict — that
        # is verified over 51,759 declarations — and the profile reports itself
        # as `+defeq-cache`, so a report never claims to be a plain run of the
        # release (P20).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill') }}
          restore-keys: mill-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: .difftest/leanprover-lean4-${{ matrix.toolchain }}
          key: nightly-${{ matrix.toolchain }}-${{ matrix.corpus }}-${{ hashFiles('difftest/toolchains.txt') }}
          restore-keys: |
            nightly-${{ matrix.toolchain }}-${{ matrix.corpus }}-
            difftest-${{ matrix.toolchain }}-
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: ./mill difftest.run provision --toolchain ${{ matrix.toolchain }}
      # The mutants are skipped: a corpus this size takes long enough once.
      # Below v4.35 the positive is_def_eq cache has to be kept or a library
      # corpus does not finish; see docs/semantics.md P12 and P20.
      - run: |
          extra=""
          case "${{ matrix.toolchain }}" in
            v4.35.*) ;;
            *) extra="--defeq-cache" ;;
          esac
          ./mill difftest.run run --toolchain "${{ matrix.toolchain }}" \
            --corpus "${{ matrix.corpus }}" --no-mutants --history $extra
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.toolchain }}-${{ matrix.corpus }}
          path: .difftest/reports/

  mathlib-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - v4.28.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill') }}
          restore-keys: mill-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # mathlib is pinned to the toolchain under test, and its cached build is
      # fetched rather than compiled.
      # mathlib has to be at the tag matching the toolchain under test: a
      # checkout pinning a different release would export declarations this
      # run's profile does not describe. A mismatch fails rather than silently
      # exporting the wrong thing.
      - name: Check out and fetch mathlib
        run: |
          git clone --quiet --depth 1 --branch ${{ matrix.toolchain }} \
            https://github.com/leanprover-community/mathlib4.git mathlib4
          cd mathlib4
          pinned="$(cat lean-toolchain)"
          expected="leanprover/lean4:${{ matrix.toolchain }}"
          test "$pinned" = "$expected" || {
            echo "mathlib at ${{ matrix.toolchain }} pins $pinned, not $expected" >&2
            exit 1
          }
          lake exe cache get
      - run: ./mill difftest.run provision --toolchain ${{ matrix.toolchain }}
      - run: >-
          ./mill difftest.run run --toolchain ${{ matrix.toolchain }}
          --corpus mathlib-sample --mathlib "$PWD/mathlib4" --no-mutants --history
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-mathlib-sample-${{ matrix.toolchain }}
          path: .difftest/reports/
